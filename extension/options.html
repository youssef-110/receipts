<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts settings</title>
<style>
  :root { --bg:#fff; --fg:#14201c; --muted:#5b6b65; --line:#d7dfdb; --accent:#0f6b53; --accent-fg:#fff; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14201c; --fg:#eaf2ee; --muted:#9bb0a7; --line:#2d3f38; --accent:#3ecf9e; --accent-fg:#06281d; --err:#ff8a80; }
  }
  body { max-width:480px; margin:32px auto; padding:0 16px; background:var(--bg); color:var(--fg);
         font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  h1 { font-size:18px; }
  label { display:block; margin-bottom:4px; }
  input { width:100%; box-sizing:border-box; padding:8px; font:inherit; border:1px solid var(--line);
          border-radius:6px; background:var(--bg); color:var(--fg); }
  button { margin-top:12px; padding:8px 16px; font:inherit; font-weight:600; border:0; border-radius:6px;
           background:var(--accent); color:var(--accent-fg); cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 0; }
  #msg { min-height:1.4em; margin-top:8px; }
  #msg.err { color:var(--err); }
</style>
</head>
<body>
  <h1>Receipts settings</h1>
  <form id="form">
    <label for="appUrl">Receipts app URL</label>
    <input id="appUrl" type="url" required placeholder="https://receipts-hex8.vercel.app" aria-describedby="hint msg">
    <p class="hint" id="hint">Must start with https://. Default: https://receipts-hex8.vercel.app</p>
    <button type="submit">Save</button>
    <p id="msg" role="status"></p>
  </form>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
