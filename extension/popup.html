<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts</title>
<style>
  :root { --bg:#fff; --fg:#14201c; --muted:#5b6b65; --line:#d7dfdb; --accent:#0f6b53; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14201c; --fg:#eaf2ee; --muted:#9bb0a7; --line:#2d3f38; --accent:#3ecf9e; --accent-fg:#06281d; }
  }
  * { box-sizing: border-box; }
  body { width:320px; margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  h1 { font-size:15px; margin:0 0 12px; }
  .label { display:block; font-size:12px; color:var(--muted); margin:0 0 4px; }
  #page { margin:0 0 12px; padding:8px; border:1px solid var(--line); border-radius:6px;
          word-break:break-all; font-size:13px; }
  select, button { width:100%; font:inherit; border-radius:6px; }
  select { padding:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); margin-bottom:12px; }
  button { padding:10px; border:0; background:var(--accent); color:var(--accent-fg); font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #note { min-height:1.4em; margin:8px 0 0; font-size:12px; color:var(--muted); }
  a { color:var(--accent); font-size:12px; }
  footer { margin-top:8px; text-align:right; }
</style>
</head>
<body>
  <h1>Receipts — check this page</h1>
  <span class="label" id="page-label">Current page</span>
  <p id="page" aria-labelledby="page-label">…</p>
  <label class="label" for="mode">Page type</label>
  <select id="mode">
    <option value="auto">Auto</option>
    <option value="vendor">Software vendor</option>
    <option value="shop">Online shop</option>
    <option value="marketplace">Marketplace listing</option>
  </select>
  <button id="check" disabled>Check this page</button>
  <p id="note" role="status"></p>
  <footer><a href="options.html" id="settings">Settings</a></footer>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
